# Snapshot of /etc/nginx/sites-available/ppathway-website on the VPS.
# Temporary advisor recruitment launch; keep in sync with app/lib/publicRoutes.ts.
server {
    server_name propheticpathway.com www.propheticpathway.com;

    client_max_body_size 100M;

    # Shared proxy settings (inherited by all locations).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;

    location = / { return 302 /join-as-advisor; }

    location /_next/       { proxy_pass http://127.0.0.1:3001; }
    location = /favicon.ico { proxy_pass http://127.0.0.1:3001; }
    location ~* \.(png|jpe?g|gif|svg|webp|ico|css|js|mjs|woff2?|ttf|eot|map)$ {
        proxy_pass http://127.0.0.1:3001;
    }

    location /join-as-advisor    { proxy_pass http://127.0.0.1:3001; }
    location /login              { proxy_pass http://127.0.0.1:3001; }
    location /signup             { proxy_pass http://127.0.0.1:3001; }
    location /advisor-onboarding { proxy_pass http://127.0.0.1:3001; }
    location /contract/sign      { proxy_pass http://127.0.0.1:3001; }
    location /contact            { proxy_pass http://127.0.0.1:3001; }
    location /terms              { proxy_pass http://127.0.0.1:3001; }
    location /privacy            { proxy_pass http://127.0.0.1:3001; }

    location / { return 404; }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/propheticpathway.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propheticpathway.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.propheticpathway.com) { return 301 https://$host$request_uri; }
    if ($host = propheticpathway.com) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name propheticpathway.com www.propheticpathway.com;
    return 404;
}
